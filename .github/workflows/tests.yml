name: Server tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Run tests with bounded hang diagnostics
        run: |
          timeout 120s python -u -c "import faulthandler, unittest; faulthandler.dump_traceback_later(45, repeat=True); suite = unittest.defaultTestLoader.discover('reverse/tests'); result = unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())"
